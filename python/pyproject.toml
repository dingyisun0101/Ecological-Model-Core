[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ecological-state-toolkit"
version = "0.12.0"
description = "Verified conversion of ecological Workflow recordings into analysis arrays"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
  "numpy>=2,<3",
  "scientific-workflow-reader>=0.1.1,<0.4",
]

[project.scripts]
ecological-state-convert = "ecological_state_toolkit.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["ecological_state_toolkit*"]
