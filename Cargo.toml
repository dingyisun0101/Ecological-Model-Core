[package]
name = "ecological-state-toolkit"
version = "0.15.0"
edition = "2024"
rust-version = "1.97"
description = "Validated ecological inputs, state schemas, trajectory observation, and terminal products"
license = "MIT"
readme = "README.md"
repository = "https://github.com/dingyisun0101/Ecological-Model-Core"
homepage = "https://github.com/dingyisun0101/Ecological-Model-Core"
documentation = "https://docs.rs/ecological-state-toolkit"
keywords = ["ecology", "simulation", "dynamical-systems", "scientific"]
categories = ["science", "simulation"]
include = ["src/**/*.rs", "tests/**/*.rs", "schemas/**/*.json", "README.md", "LICENSE"]

[dependencies]
nalgebra = "0.34.1"
physics_in_parallel = "=4.1.1-alpha"
scientific-workflow = "0.16.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
thiserror = "2"

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
