[package]
name = "ecological-state-toolkit"
version = "0.13.0"
edition = "2024"
rust-version = "1.97"
description = "End-to-end ecological state construction, schemas, observation, and analysis conversion"
license = "MIT"
readme = "README.md"
repository = "https://github.com/dingyisun0101/Ecological-Model-Core"
homepage = "https://github.com/dingyisun0101/Ecological-Model-Core"
documentation = "https://docs.rs/ecological-state-toolkit"
keywords = ["ecology", "simulation", "dynamical-systems", "scientific"]
categories = ["science", "simulation"]
include = ["src/**/*.rs", "tests/**/*.rs", "schemas/**/*.json", "python/**/*.py", "python/pyproject.toml", "python/README.md", "README.md", "LICENSE"]

[dependencies]
physics_in_parallel = "4.0.0-alpha.2"
scientific-workflow = "0.13.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
thiserror = "2"

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
