[package]
name = "ecological-model-core"
version = "0.11.0"
edition = "2024"
rust-version = "1.97"
description = "Shared ecological initial states, interactions, trajectory observation, and terminal products"
license = "MIT"
readme = "README.md"
repository = "https://github.com/dingyisun0101/Ecological-Model-Core"
homepage = "https://github.com/dingyisun0101/Ecological-Model-Core"
documentation = "https://docs.rs/ecological-model-core"
keywords = ["ecology", "simulation", "dynamical-systems", "scientific"]
categories = ["science", "simulation"]
include = ["src/**/*.rs", "tests/**/*.rs", "README.md", "LICENSE"]

[dependencies]
physics_in_parallel = "3.7.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
thiserror = "2"

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
